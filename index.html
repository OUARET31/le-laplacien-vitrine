<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LE LAPLACIEN — Cours de sciences du collège au supérieur</title>
<meta name="description" content="Cours, vidéos et exercices de mathématiques, physique-chimie, SVT, langage C, Python, électronique et FPGA/VHDL, du collège aux études supérieures.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f1630; --ink2:#18224a; --blue:#2443b8; --blue-dark:#162d86; --gold:#f2b134;
    --paper:#f4f2ec; --card:#ffffff; --text:#1d2238; --muted:#5d6380; --line:#e3e0d6;
    --header-h:70px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--paper);line-height:1.65;font-size:16px;overflow-x:hidden}
  a{color:var(--blue);text-decoration:none;font-weight:500}
  a:hover{color:var(--blue-dark)}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em}
  .sym{font-family:"Cambria Math","STIX Two Math","Segoe UI Symbol","DejaVu Sans",serif}

  /* ---------- Fond 3D (plan en perspective) ---------- */
  .bg3d{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:
      radial-gradient(1200px 600px at 80% -10%, rgba(36,67,184,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(242,177,52,.12), transparent 60%), var(--paper)}
  .bg3d .floor{position:absolute;left:-50%;right:-50%;bottom:-30%;height:90%;
    background-image:linear-gradient(rgba(15,22,48,.07) 1px, transparent 1px),linear-gradient(90deg, rgba(15,22,48,.07) 1px, transparent 1px);
    background-size:64px 64px;transform:perspective(600px) rotateX(62deg);transform-origin:50% 0;
    mask-image:linear-gradient(to top, #000 10%, transparent 85%);-webkit-mask-image:linear-gradient(to top, #000 10%, transparent 85%);
    animation:floor 18s linear infinite}
  @keyframes floor{to{background-position:0 64px}}
  .bg3d .shape{position:absolute;opacity:.12;animation:float 14s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-24px) rotate(8deg)}}

  /* ---------- En-tête ---------- */
  header{position:sticky;top:0;z-index:30;height:var(--header-h);background:rgba(15,22,48,.92);backdrop-filter:blur(10px);color:#fff;
    display:flex;align-items:center;gap:28px;padding:0 4vw;box-shadow:0 2px 0 var(--gold), 0 10px 30px rgba(15,22,48,.25)}
  .logo{display:flex;align-items:center;gap:12px;color:#fff;white-space:nowrap}
  .logo:hover{color:#fff}
  .logo .mark{width:42px;height:42px;border-radius:11px;background:linear-gradient(145deg,#ffd27a,#e09a1c);color:var(--ink);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:22px;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), 0 4px 0 #a86f0e, 0 8px 16px rgba(0,0,0,.35);transform:translateY(-2px)}
  .logo .mark sup{font-size:12px;margin-left:1px;position:relative;top:-7px;vertical-align:baseline}
  .logo .name{font-family:Fraunces,serif;font-weight:700;font-size:21px;letter-spacing:.08em}
  nav.topnav{display:flex;gap:6px;margin-left:auto}
  nav.topnav a{color:#dfe3f5;font-weight:500;padding:8px 14px;border-radius:9px;white-space:nowrap;transition:transform .15s, background .15s}
  nav.topnav a:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateY(-1px)}
  nav.topnav a.active{background:linear-gradient(145deg,#ffd27a,#f2b134);color:var(--ink);box-shadow:0 3px 0 #a86f0e}
  .search{position:relative}
  .search input{width:210px;padding:9px 12px 9px 36px;border:1px solid rgba(255,255,255,.18);border-radius:10px;font:inherit;font-size:14px;background:rgba(255,255,255,.08);color:#fff}
  .search input::placeholder{color:#aab1d0}
  .search input:focus{outline:2px solid var(--gold);outline-offset:-1px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aab1d0}
  .search-results{position:absolute;top:115%;right:0;width:340px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(15,22,48,.2);display:none;max-height:380px;overflow:auto}
  .search-results a{display:block;padding:9px 14px;font-size:14px;border-bottom:1px solid #f1efe8}
  .search-results a:hover{background:#f7f5ef}
  .search-results small{display:block;color:var(--muted);font-weight:400}
  .burger{display:none;background:none;border:0;padding:6px;cursor:pointer;color:#fff}

  /* ---------- Accueil ---------- */
  .hero{position:relative;background:radial-gradient(900px 500px at 75% 40%, #22306a 0%, var(--ink) 60%);color:#fff;padding:70px 4vw 120px;overflow:hidden;min-height:520px}
  .hero canvas{position:absolute;right:-4vw;top:0;width:62vw;height:100%;max-width:900px}
  .hero .inner{max-width:1180px;margin:0 auto;position:relative;z-index:1}
  .hero h1{font-size:clamp(44px,7vw,84px);margin:0 0 6px;letter-spacing:.06em;font-weight:900;
    text-shadow:0 1px 0 #c9cde0,0 2px 0 #b3b8d0,0 3px 0 #9aa0bd,0 4px 0 #858caa,0 5px 0 #6f7698,0 12px 20px rgba(0,0,0,.5)}
  .hero .formula{color:var(--gold);font-size:24px;margin-bottom:22px}
  .hero p{max-width:540px;color:#c8cde6;font-size:18px;margin:0 0 26px}
  .hero .cta{display:inline-flex;gap:12px;flex-wrap:wrap}
  .btn3d{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;font-weight:600;color:var(--ink);
    background:linear-gradient(145deg,#ffd27a,#f2b134);box-shadow:0 5px 0 #a86f0e, 0 12px 24px rgba(0,0,0,.3);transition:transform .12s, box-shadow .12s}
  .btn3d:hover{color:var(--ink);transform:translateY(2px);box-shadow:0 3px 0 #a86f0e, 0 8px 16px rgba(0,0,0,.3)}
  .btn3d.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2)}

  .levels{max-width:1180px;margin:-80px auto 80px;padding:0 4vw;display:grid;grid-template-columns:repeat(2,1fr);gap:26px;position:relative;z-index:2}

  /* Cartes 3D inclinables */
  .tilt{transform-style:preserve-3d;transition:transform .25s ease, box-shadow .25s ease;will-change:transform;position:relative}
  .tilt .glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(400px circle at var(--gx,50%) var(--gy,0%), rgba(255,255,255,.35), transparent 45%);opacity:0;transition:opacity .25s}
  .tilt:hover .glare{opacity:1}
  .depth-1{transform:translateZ(30px)}
  .depth-2{transform:translateZ(55px)}

  .level-card{border-radius:20px;overflow:hidden;background:var(--card);color:var(--text);
    box-shadow:0 2px 0 rgba(0,0,0,.04), 0 24px 50px rgba(15,22,48,.18);display:flex;flex-direction:column}
  .level-card:hover{color:var(--text);box-shadow:0 30px 70px rgba(15,22,48,.28)}
  .level-card .art{height:210px;position:relative}
  .level-card .art svg{width:100%;height:100%;display:block}
  .level-card .body{padding:22px 24px 24px;display:flex;flex-direction:column;flex:1;transform-style:preserve-3d}
  .level-card h2{margin:0 0 4px;font-size:30px;color:var(--c)}
  .level-card p{margin:0 0 14px;color:var(--muted);font-weight:400}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .chip{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:#f1efe8;color:var(--text)}
  .level-card .go{margin-top:16px;color:var(--c);font-weight:700}

  .features{max-width:1180px;margin:0 auto 90px;padding:0 4vw;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .feature{background:rgba(255,255,255,.75);backdrop-filter:blur(6px);border:1px solid #fff;border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(15,22,48,.08)}
  .feature .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--gold);font-weight:700;font-size:20px;
    box-shadow:0 4px 0 #000, 0 10px 18px rgba(15,22,48,.3);margin-bottom:12px}
  .feature h3{margin:0 0 4px;font-size:20px}
  .feature p{margin:0;color:var(--muted)}

  /* ---------- Bandeau ---------- */
  .banner{position:relative;color:#fff;padding:40px 4vw 46px;overflow:hidden;background:var(--ink);border-bottom:4px solid var(--c, var(--gold))}
  .banner .art{position:absolute;inset:0;opacity:.55}
  .banner .art svg{width:100%;height:100%}
  .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, rgba(15,22,48,.95) 25%, rgba(15,22,48,.35))}
  .banner .inner{max-width:1500px;margin:0 auto;position:relative;z-index:1}
  .banner .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .banner h1{margin:4px 0 4px;font-size:clamp(32px,4.4vw,52px);text-shadow:0 2px 0 rgba(0,0,0,.35),0 4px 0 rgba(0,0,0,.2),0 10px 24px rgba(0,0,0,.5)}
  .banner p{margin:0;color:#c8cde6;max-width:720px}
  .yearbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .yearbar a{color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;
    box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .12s}
  .yearbar a:hover{transform:translateY(-2px);background:rgba(255,255,255,.18)}

  /* ---------- 3 colonnes ---------- */
  .layout{display:grid;grid-template-columns:270px minmax(0,1fr) 220px;gap:40px;max-width:1500px;margin:0 auto;padding:36px 4vw 90px}
  aside.left, aside.right{position:sticky;top:calc(var(--header-h) + 24px);align-self:start;max-height:calc(100vh - var(--header-h) - 48px);overflow:auto}
  aside.left{background:rgba(255,255,255,.7);backdrop-filter:blur(6px);border:1px solid #fff;border-radius:16px;padding:10px;box-shadow:0 10px 30px rgba(15,22,48,.07)}
  .side-group{margin-bottom:2px}
  .side-group > button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;
    color:var(--ink);font-weight:700;font-size:16px;padding:10px 12px;border-radius:10px;line-height:1.4}
  .side-group > button:hover{background:#ece9df}
  .side-group > button svg{transition:transform .2s;flex:none;margin-left:10px;color:var(--muted)}
  .side-group.open > button svg{transform:rotate(90deg)}
  .side-group .inner{display:none;padding:0 4px 8px 12px}
  .side-group.open .inner{display:block}
  .side-sub{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sc);margin:10px 0 2px 6px;display:flex;align-items:center;gap:6px}
  .side-sub::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sc)}
  .side-group ul{list-style:none;margin:0;padding:0 0 0 10px;border-left:2px solid var(--line);margin-left:9px}
  .side-group li a{display:block;font-size:14px;font-weight:400;padding:3px 8px;color:#444b66;border-radius:6px}
  .side-group li a:hover{color:var(--blue)}
  .side-group li a.current{color:var(--blue);font-weight:600;background:#e9edfb}

  aside.right h4{margin:0 0 12px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  aside.right ul{list-style:none;margin:0;padding:0}
  aside.right li a{display:block;padding:5px 0 5px 12px;font-size:15px;border-left:2px solid var(--line);color:#444b66;font-weight:400}
  aside.right li a:hover{color:var(--blue)}
  aside.right li a.active{border-left-color:var(--gold);color:var(--ink);font-weight:700}
  main{min-width:0}

  .soon{max-width:900px;margin:0 auto 34px;background:linear-gradient(135deg,#fff8e6,#fff);border:1px solid #f1dfae;border-radius:14px;padding:14px 18px;box-shadow:0 6px 18px rgba(242,177,52,.15)}

  /* Années */
  .year{max-width:980px;margin:0 auto 54px;scroll-margin-top:calc(var(--header-h) + 20px)}
  .year-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
  .year-badge{min-width:64px;height:64px;padding:0 10px;border-radius:16px;background:linear-gradient(145deg,var(--c2,#2a3a80),var(--ink));color:#fff;font-family:Fraunces,serif;font-weight:900;font-size:24px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #070b1c, 0 16px 26px rgba(15,22,48,.35);transform:rotate(-4deg)}
  .year-head h2{margin:0;font-size:32px;color:var(--ink)}
  .year-head p{margin:0;color:var(--muted)}
  .subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
  .subject{border-radius:18px;overflow:hidden;background:var(--card);box-shadow:0 2px 0 rgba(0,0,0,.04),0 18px 40px rgba(15,22,48,.14);display:flex;flex-direction:column}
  .subject .art{height:180px;position:relative}
  .subject .art svg{width:100%;height:100%;display:block}
  .subject .art::after{content:"";position:absolute;inset:0;background:linear-gradient(to top, rgba(10,14,32,.65), transparent 65%)}
  .subject .title{z-index:1}
  .subject .title{position:absolute;left:16px;bottom:12px;color:#fff;display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:700;font-size:22px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  .subject .title .ico{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;font-size:14px;font-weight:700}
  .subject ul{list-style:none;margin:0;padding:10px 12px 14px}
  .subject li a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--text);font-weight:500;font-size:15px;transition:background .15s, transform .15s}
  .subject li a:hover{background:#f6f4ee;transform:translateX(4px);color:var(--ink)}
  .subject li a .thumb{width:38px;height:26px;border-radius:6px;overflow:hidden;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .subject li a .thumb svg{width:100%;height:100%;display:block}

  /* Leçon */
  .breadcrumb{font-size:14px;color:var(--muted);margin-bottom:10px}
  article.lesson{max-width:900px;margin:0 auto;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.04),0 24px 50px rgba(15,22,48,.14)}
  article.lesson .cover{height:280px;position:relative}
  article.lesson .cover svg{width:100%;height:100%;display:block}
  article.lesson .content{padding:30px 40px 30px}
  article.lesson h1{font-size:36px;color:var(--ink);margin:0 0 6px;line-height:1.2}
  article.lesson .meta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px;background:#f1efe8;color:var(--muted)}
  article.lesson .rule{height:4px;width:80px;background:var(--gold);border-radius:2px;margin:14px 0 6px}
  article.lesson h2{font-size:24px;margin:28px 0 10px;color:var(--ink);scroll-margin-top:calc(var(--header-h) + 20px)}
  .pager{display:flex;justify-content:space-between;gap:16px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
  .pager a{display:block;padding:12px 16px;border:1px solid var(--line);border-radius:12px;max-width:48%;box-shadow:0 3px 0 var(--line);transition:transform .12s}
  .pager a small{display:block;color:var(--muted);font-weight:400}
  .pager a:hover{transform:translateY(-2px);border-color:var(--blue)}


  /* ---------- Photo plein écran estompée (effet 3D) ---------- */
  #pagebg{position:fixed;left:0;right:0;top:0;height:115vh;z-index:-1;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .4s}
  #pagebg.on{opacity:1}
  #pagebg img{width:100%;height:100%;object-fit:cover;transform-origin:50% 30%;will-change:transform;
    -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 30%,rgba(0,0,0,.55) 55%,transparent 82%);mask-image:linear-gradient(to bottom,#000 0%,#000 30%,rgba(0,0,0,.55) 55%,transparent 82%)}
  #pagebg .tint{position:absolute;inset:0;background:linear-gradient(180deg, rgba(10,14,32,.72) 0%, rgba(10,14,32,.35) 30%, transparent 60%),
    radial-gradient(800px 400px at 15% 20%, color-mix(in srgb, var(--c) 35%, transparent), transparent 70%)}
  .pagehero{color:#fff;padding:13vh 4vw 6vh;position:relative}
  .pagehero .inner{max-width:1500px;margin:0 auto}
  .pagehero .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  .pagehero .kicker a{color:var(--gold)}
  .pagehero h1{margin:6px 0 6px;font-size:clamp(36px,5.5vw,68px);display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    text-shadow:0 1px 0 #d6d9e8,0 2px 0 #b9bdd2,0 3px 0 #9ca2bb,0 4px 0 #7f86a3,0 14px 30px rgba(0,0,0,.6)}
  .pagehero p{margin:0;color:#e3e6f5;max-width:720px;font-size:18px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .ico3d{width:64px;height:64px;border-radius:16px;background:linear-gradient(145deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c));color:#fff;font-family:Inter,sans-serif;font-size:24px;font-weight:700;
    display:flex;align-items:center;justify-content:center;text-shadow:none;box-shadow:0 6px 0 color-mix(in srgb, var(--c) 55%, #000), 0 18px 30px rgba(0,0,0,.4);transform:rotate(-5deg)}
  .art.photo{background:#0f1630}
  .art.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
  .level-card:hover .art.photo img,.subject:hover .art.photo img{transform:scale(1.04)}
  .subject{cursor:pointer}
  .subject li a .num{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;
    background:linear-gradient(145deg,#2b3a80,var(--ink));box-shadow:0 3px 0 #070b1c}
  .seeall{margin:0 12px 14px;padding:10px 14px;border-radius:12px;background:#f4f2ec;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;align-items:center;transition:background .15s}
  .subject:hover .seeall{background:var(--gold)}
  a.side-sub{text-decoration:none}
  a.side-sub:hover,a.side-sub.cur{text-decoration:underline}
  .lesson-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;max-width:980px;margin:0 auto}
  .lesson-card{display:flex;flex-direction:column;gap:8px;min-height:150px;padding:20px;border-radius:18px;color:var(--ink);
    background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-top:5px solid var(--c);
    box-shadow:0 18px 40px rgba(15,22,48,.18)}
  .lesson-card:hover{color:var(--ink);box-shadow:0 28px 60px rgba(15,22,48,.28)}
  .lesson-card .bignum{font-family:Fraunces,serif;font-weight:900;font-size:40px;line-height:1;color:var(--c);text-shadow:0 3px 0 rgba(0,0,0,.12)}
  .lesson-card .lt{font-size:18px;font-weight:600;line-height:1.35}
  .lesson-card .soon-tag{margin-top:auto;font-size:12px;font-weight:700;color:var(--muted)}
  .soon,.year-head h2,.year-head p{position:relative}
  .layout aside.left{background:rgba(255,255,255,.82)}
  .layout aside.right{background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(15,22,48,.08)}
  article.lesson{background:rgba(255,255,255,.9);backdrop-filter:blur(10px)}


  /* ---------- Miniatures, cartes leçons photo ---------- */
  .subject li a .thumb{position:relative;width:54px;height:38px;border-radius:8px;overflow:hidden;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .subject li a .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .subject li a .thumb .num{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:5px;font-size:10px;box-shadow:none}
  .lesson-card{padding:0;overflow:hidden;min-height:0}
  .lesson-card .lphoto{display:block;height:140px;overflow:hidden}
  .lesson-card .lphoto img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
  .lesson-card:hover .lphoto img{transform:scale(1.05)}
  .lesson-card .bignum{position:absolute;top:104px;left:16px;background:#fff;border-radius:12px;padding:4px 10px;font-size:30px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
  .lesson-card .lbody{display:flex;flex-direction:column;gap:6px;padding:26px 18px 16px;flex:1}
  article.lesson .cover{height:300px;position:relative;overflow:hidden}
  article.lesson .cover img{width:100%;height:100%;object-fit:cover;display:block}
  /* ---------- Bandeau de photos ---------- */

function hash(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;} return h>>>0; }

/* ===================== Effet 3D d'inclinaison ===================== */
function enableTilt(root){
  if (matchMedia("(hover: none)").matches || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  root.querySelectorAll(".tilt").forEach(el => {
    const max = parseFloat(el.dataset.tilt || 10);
    el.addEventListener("mousemove", e => {
      const r = el.getBoundingClientRect(), px = (e.clientX - r.left)/r.width, py = (e.clientY - r.top)/r.height;
      el.style.transform = `perspective(900px) rotateX(${(.5-py)*max}deg) rotateY(${(px-.5)*max}deg) translateY(-6px)`;
      el.style.setProperty("--gx", px*100+"%"); el.style.setProperty("--gy", py*100+"%");
    });
    el.addEventListener("mouseleave", () => { el.style.transform = ""; });
  });
}

let heroAnim = null;
function startHero(canvas){
  const ctx = canvas.getContext("2d"); let t = 0, mx = 0, my = 0, rot = 0;
  const N = 34, S = 3.2;
  const resize = () => { const dpr = Math.min(2, devicePixelRatio||1); canvas.width = canvas.clientWidth*dpr; canvas.height = canvas.clientHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  resize(); addEventListener("resize", resize);
  canvas.parentElement.addEventListener("mousemove", e => { const r = canvas.getBoundingClientRect(); mx = (e.clientX - r.left)/r.width - .5; my = (e.clientY - r.top)/r.height - .5; });
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function f(x,y){ const r = Math.hypot(x,y); return Math.cos(r*2.4 - t)*Math.exp(-r*.35)*.9 + .25*Math.sin(x*1.3+t*.6)*Math.cos(y*1.1); }

  // --- Texture de la Terre (continents générés une seule fois) ---
  const TW = 256, TH = 128, tex = new Uint8ClampedArray(TW*TH*3);
  const R0 = rng(20261119), blobs = Array.from({length:34}, () => [R0()*2*Math.PI, (R0()-.5)*2.2, .09+R0()*.2]);
  for (let j=0;j<TH;j++) for (let i=0;i<TW;i++){
    const lon = i/TW*2*Math.PI, lat = (j/TH-.5)*Math.PI; let v = 0;
    for (const [bl, bt, br] of blobs){ let dl = Math.abs(lon-bl); dl = Math.min(dl, 2*Math.PI-dl); const dd = (dl*Math.cos(lat))**2 + (lat-bt*.7)**2; v += Math.exp(-dd/(br*br)); }
    v += .12*Math.sin(lon*7+lat*5)*Math.cos(lat*9);
    let c;
    if (Math.abs(lat) > 1.22) c = [235,242,250];
    else if (v > .7) c = v > 1.45 ? [186,160,110] : [60+30*Math.abs(lat),140-20*Math.abs(lat),70];
    else { const k = Math.min(1, v*1.3); c = [20+30*k, 80+60*k, 170+45*k]; }
    tex.set(c, (j*TW+i)*3);
  }
  const off = document.createElement("canvas"), octx = off.getContext("2d");
  function drawEarth(cx, cy, R){
    const D = Math.max(8, Math.round(R*2)); off.width = off.height = D;
    const im = octx.createImageData(D, D), px = im.data, L = [-.55,-.5,.67];
    for (let y=0;y<D;y++) for (let x=0;x<D;x++){
      const u = (x+.5)/D*2-1, v = (y+.5)/D*2-1, q = u*u+v*v; if (q > 1) continue;
      const z = Math.sqrt(1-q), lat = Math.asin(-v), lon = ((Math.atan2(u, z) + rot) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
      const ti = (Math.floor((lat/Math.PI+.5)*(TH-1))*TW + Math.floor(lon/(2*Math.PI)*(TW-1)))*3;
      const lit = Math.max(.18, u*L[0] + v*L[1] + z*L[2]), rim = Math.pow(1-z, 3)*.6, o = (y*D+x)*4;
      px[o]   = Math.min(255, tex[ti]*lit + 90*rim);
      px[o+1] = Math.min(255, tex[ti+1]*lit + 150*rim);
      px[o+2] = Math.min(255, tex[ti+2]*lit + 255*rim);
      px[o+3] = q > .97 ? 255*(1-q)/.03 : 255;
    }
    octx.putImageData(im, 0, 0);
    const g = ctx.createRadialGradient(cx, cy, R*.9, cx, cy, R*1.5);
    g.addColorStop(0, "rgba(120,190,255,.45)"); g.addColorStop(1, "rgba(120,190,255,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R*1.5, 0, 2*Math.PI); ctx.fill();
    ctx.drawImage(off, cx-R, cy-R, 2*R, 2*R);
  }

  function frame(){
    const w = canvas.clientWidth, h = canvas.clientHeight; ctx.clearRect(0,0,w,h);
    const yaw = .7 + t*.08 + mx*.6, pitch = 1.05 + my*.25, cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const scale = Math.min(w,h)*.19, ox = w*.5, oy = h*.52;
    const proj = (x, y, z) => { const X = x*cy - y*sy, Y = x*sy + y*cy; const Y2 = Y*cp - z*sp, Z2 = Y*sp + z*cp; const d = 9/(9+Y2*.9);
      return [ox + X*scale*d, oy - Z2*scale*d*.9 + Y2*scale*.05, Y2, z, d]; };
    const pts = []; for(let i=0;i<N;i++){ pts[i]=[]; for(let j=0;j<N;j++){ const x=(i/(N-1)-.5)*2*S, y=(j/(N-1)-.5)*2*S; pts[i][j]=proj(x,y,f(x,y)); } }
    // La Terre roule sur la surface
    const er = .5, ex = 1.75*Math.cos(t*.3), ey = 1.75*Math.sin(t*.3), E = proj(ex, ey, f(ex,ey) + er);
    const ER = Math.min(80, er*scale*E[4]*1.05);
    ctx.lineWidth = 1.1;
    const seg = (p, q) => { const a = Math.max(.08, Math.min(.85, .55 - p[2]*.09)), warm = (p[3]+1)/2;
      ctx.strokeStyle = `rgba(242,${Math.round(150+60*warm)},${Math.round(52+120*(1-warm))},${a})`;
      ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke(); };
    for (const pass of [0,1]){
      for(let i=0;i<N;i++) for(let j=0;j<N;j++){ const p = pts[i][j]; if ((p[2] > E[2]) !== (pass === 0)) continue;
        if(i<N-1) seg(p, pts[i+1][j]); if(j<N-1) seg(p, pts[i][j+1]); }
      if (pass === 0) drawEarth(E[0], E[1], ER);
    }
    if(!still){ t += .018; rot += .012; heroAnim = requestAnimationFrame(frame); }
  }
  frame();
  if (still) { addEventListener("resize", () => { resize(); frame(); }); setTimeout(() => { resize(); frame(); }, 400); }
}

// Image avec repli automatique sur l'illustration générée si la photo ne charge pas
function img(photoId, w, fallbackMat, seed, couleur, cls="", noFit=false){
  const fb = encodeURIComponent(art(fallbackMat, seed, couleur)).replace(/'/g,'%27');
  const pos = POS[photoId] ? `style="object-position:${POS[photoId]}"` : "";
  return `<img class="${cls}" src="${PHOTO(photoId)}${w}" alt="" loading="lazy" decoding="async" ${pos}
    onerror="this.onerror=null;this.src='data:image/svg+xml;charset=utf-8,${fb}'">`;
}

// Fond plein écran : photo estompée vers le bas, effet de profondeur
let bgHandlers = null;
function setBackground(photoId, mat, seed, couleur){
  const bg = $("pagebg");
  if (!photoId) { bg.innerHTML = ""; bg.classList.remove("on"); return; }
  bg.innerHTML = img(photoId, 1920, mat, seed, couleur, "", true) + `<div class="tint" style="--c:${couleur}"></div>`;
  bg.classList.add("on");
  const im = bg.querySelector("img");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let mx = 0, my = 0;
  const apply = () => {
    const y = scrollY;
    im.style.transform = `perspective(1200px) translate3d(0, ${y*0.35}px, 0) scale(${1.04 + y*0.0001}) rotateX(${my*1.5}deg) rotateY(${mx*-2}deg)`;
    bg.style.opacity = Math.max(0.15, 1 - y/1100);
  };
  if (bgHandlers) { removeEventListener("scroll", bgHandlers.s); removeEventListener("mousemove", bgHandlers.m); }
  if (!still) {
    bgHandlers = { s: () => requestAnimationFrame(apply), m: e => { mx = e.clientX/innerWidth - .5; my = e.clientY/innerHeight - .5; requestAnimationFrame(apply); } };
    addEventListener("scroll", bgHandlers.s, { passive:true }); addEventListener("mousemove", bgHandlers.m);
  }
  apply();
}

// Mini-mise en forme du texte des leçons (### titre, **gras**, listes, tableaux, encadrés)
function md(text){
  const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline = t => esc(t).replace(/\[\[(.+?)\]\](?!\])/g, "<code>$1</code>").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const lines = String(text).replace(/^\s*\n/,"").replace(/\s+$/,"").split("\n"); let out = "", i = 0;
  while (i < lines.length){
    const L = lines[i].trim();
    if (L.startsWith("~~~")){
      const lang = L.slice(3).trim(), code = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith("~~~")) code.push(lines[i++]); i++;
      const ind = Math.min(...code.filter(x => x.trim()).map(x => x.match(/^ */)[0].length), 99);
      out += `<pre class="code"${lang ? ` data-lang="${esc(lang)}"` : ""}><code>${esc(code.map(x => x.slice(ind)).join("\n"))}</code></pre>`; continue;
    }
    if (!L){ i++; continue; }
    if (L.startsWith("### ")){ out += `<h3>${inline(L.slice(4))}</h3>`; i++; continue; }
    if (L.startsWith("|")){
      const rows = []; while (i < lines.length && lines[i].trim().startsWith("|")){ const t = lines[i].trim(); if (!/^\|[\s\-:|]+\|$/.test(t)) rows.push(t.slice(1,-1).split("|").map(c => c.trim())); i++; }
      out += `<div class="tbl"><table><thead><tr>${rows[0].map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if (/^- /.test(L)){ let li=""; while (i < lines.length && /^- /.test(lines[i].trim())){ li += `<li>${inline(lines[i].trim().slice(2))}</li>`; i++; } out += `<ul>${li}</ul>`; continue; }
    if (/^\d+\. /.test(L)){ let li=""; while (i < lines.length && /^\d+\. /.test(lines[i].trim())){ li += `<li>${inline(lines[i].trim().replace(/^\d+\. /,""))}</li>`; i++; } out += `<ol>${li}</ol>`; continue; }
    if (L.startsWith("> ")){ out += `<div class="note">💡 ${inline(L.slice(2))}</div>`; i++; continue; }
    let p = L; i++; while (i < lines.length && lines[i].trim() && !/^(### |\||- |\d+\. |> |~~~)/.test(lines[i].trim())){ p += " " + lines[i].trim(); i++; }
    out += `<p>${inline(p)}</p>`;
  }
  return out;
}

function niveauxTabs(items, key, hp){

}
function exosParNiveau(c){
  const n = c.niveaux || {};
  const all = [].concat((n.facile||[]).map(e => ({...e, niveau:"facile"})),
                        (c.exercices||[]).map(e => ({...e, niveau:e.niveau||"intermediaire"})),
                        (n.intermediaire||[]).map(e => ({...e, niveau:"intermediaire"})),
                        (n.difficile||[]).map(e => ({...e, niveau:"difficile"})));

function bindTabs(root){

/* ---------- Quiz (QCM, vrai/faux, réponse à écrire) ---------- */
const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/,/g,".").replace(/\s+/g,"").replace(/[°²³]/g,m=>m);
function quizHtml(qs, key){
  if (!qs || !qs.length) return "";
  return `<div class="quiz" data-total="${qs.length}"><div class="qscore">Score : <b>0</b> / ${qs.length}</div>
    ${qs.map((q,i) => {
      const type = q.rep ? "trou" : (q.choix && q.choix.length === 2 && q.choix[0] === "Vrai") ? "vf" : "qcm";
      const lab = {qcm:"QCM", vf:"Vrai ou faux", trou:"À toi d'écrire"}[type];
      const zone = type === "trou"
        ? `<div class="qtrou"><input type="text" aria-label="Ta réponse" placeholder="Ta réponse…"><button class="qok">Vérifier</button></div>`
        : `<div class="qopts ${type}">${q.choix.map((o,j) => `<button class="qopt" data-j="${j}">${md(o).replace(/^<p>|<\/p>$/g,"")}</button>`).join("")}</div>`;
      return `<div class="qcard" data-i="${i}" data-type="${type}" data-bonne="${q.bonne ?? ""}" data-rep="${(q.rep||[]).join("¦").replace(/"/g,"&quot;")}">
        <div class="qhead"><span class="qn">${i+1}</span><span class="qtype">${lab}</span>${q.niveau ? `<span class="qniv n-${q.niveau}">${{facile:"Facile",intermediaire:"Intermédiaire",difficile:"Difficile"}[q.niveau]}</span>` : ""}</div>
        <div class="qq">${md(q.q)}</div>${zone}
        <div class="qfb" hidden></div>
        <template>${md(q.pourquoi || "")}</template></div>`; }).join("")}
    <button class="qreset">↺ Recommencer le quiz</button></div>`;
}
function bindQuiz(root){
  root.querySelectorAll(".quiz").forEach(Q => {
    let score = 0;
    const upd = () => Q.querySelector(".qscore b").textContent = score;
    const done = (card, ok, extra) => {
      card.classList.add("done", ok ? "ok" : "ko"); if (ok) score++; upd();
      const fb = card.querySelector(".qfb"); fb.hidden = false;
      fb.innerHTML = `<b>${ok ? "✅ Bravo !" : "❌ Pas tout à fait."}</b> ${extra||""}${card.querySelector("template").innerHTML}`;
    };
    Q.querySelectorAll(".qcard").forEach(card => {
      if (card.dataset.type === "trou"){
        const inp = card.querySelector("input"), go = () => {
          if (card.classList.contains("done") || !inp.value.trim()) return;
          const reps = card.dataset.rep.split("¦"), ok = reps.some(r => norm(r) === norm(inp.value));
          inp.disabled = true; done(card, ok, ok ? "" : `La réponse attendue : <b>${reps[0]}</b>. `);
        };
        card.querySelector(".qok").onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); };
      } else card.querySelectorAll(".qopt").forEach(b => b.onclick = () => {
        if (card.classList.contains("done")) return;
        const good = +card.dataset.bonne, j = +b.dataset.j;
        card.querySelectorAll(".qopt").forEach(x => { x.disabled = true; if (+x.dataset.j === good) x.classList.add("good"); });
        if (j !== good) b.classList.add("bad");
        done(card, j === good);
      });
    });
    Q.querySelector(".qreset").onclick = () => { const k = Q.outerHTML; const tmp = document.createElement("div"); tmp.innerHTML = k; tmp.querySelectorAll(".qcard").forEach(c => { c.classList.remove("done","ok","ko"); c.querySelector(".qfb").hidden = true; c.querySelectorAll(".qopt").forEach(x => { x.disabled = false; x.classList.remove("good","bad"); }); const i = c.querySelector("input"); if (i){ i.disabled = false; i.value = ""; } }); tmp.querySelector(".qscore b").textContent = 0; const n = tmp.firstElementChild; Q.replaceWith(n); bindQuiz(n.parentElement); };
  });
}

    try { const r = await fetch("/api/prevenir", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({email: $("we").value, formule: $("wf").value})});
      $("wm").textContent = r.ok ? "Merci ! Tu seras prévenu(e) dès l'ouverture." : "Adresse e-mail invalide."; $("wm").style.color = r.ok ? "#14805e" : "#c0262d"; }
    catch(_) { $("wm").textContent = "Erreur réseau, réessaie."; } };
}
function renderConnexion(){
  petitePage("Espace abonnés", "Se connecter", "Connecte-toi pour accéder à toutes tes leçons.",
   `<div class="login"><form id="logf"><label>Identifiant<input id="lu" autocomplete="username" required></label><label>Mot de passe<input id="lp" type="password" autocomplete="current-password" required></label>
     <button class="pw-btn" type="submit">Se connecter</button></form><div class="msg" id="lm"></div>
     <p style="text-align:center;margin-top:16px">Pas encore abonné ? <a href="#abonnement"><b>Voir les formules</b></a></p></div>`, "#2443b8", 6340620);
  $("logf").onsubmit = async e => { e.preventDefault(); $("lm").textContent = "…";
    try { const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({u: $("lu").value, p: $("lp").value})});
      if (r.ok) { location.hash = "#accueil"; location.reload(); } else { $("lm").textContent = "Identifiant ou mot de passe incorrect."; $("lm").style.color = "#c0262d"; } }
    catch(_) { $("lm").textContent = "Erreur réseau, réessaie."; } };
}

function route(){
  setTimeout(suivi, 300);
  if (heroAnim) { cancelAnimationFrame(heroAnim); heroAnim = null; }
  const h = location.hash.slice(1);
  if (h === "anecdotes") { renderAnecdotes(); $("topnav").classList.remove("open"); window.scrollTo({top:0}); return; }
  if (h === "abonnement") { renderAbonnement(); $("topnav").classList.remove("open"); window.scrollTo({top:0}); return; }
  if (h === "connexion") { if (MEMBRE) { location.hash = "#accueil"; return; } renderConnexion(); $("topnav").classList.remove("open"); window.scrollTo({top:0}); return; }
  const [rid, sub] = h.split("--");
  const r = SITE.find(x => x.id === rid);
  if (!r) renderHome();
  else if (!sub) renderRubrique(r);
  else {
    let done = false;
    for (const a of r.annees) for (const m of a.liste) {
      if (m.page === sub) { renderMatiere(r, a, m); done = true; }
      const idx = m.lecons.findIndex(l => l.id === sub);
      if (idx >= 0) { renderLesson(r, { l:m.lecons[idx], a, m, idx, list:m.lecons }); done = true; }
    }
    if (!done) renderRubrique(r);
  }
  $("topnav").classList.remove("open");
  window.scrollTo({top:0});
}
addEventListener("hashchange", route);
$("burger").onclick = () => $("topnav").classList.toggle("open");
$("year").textContent = new Date().getFullYear();

/* Recherche */
const index = SITE.flatMap(r => r.annees.flatMap(a => a.liste.flatMap(m => m.lecons.map(l => ({r, a, m, l})))));
$("q").addEventListener("input", e => {
  const q = slug(e.target.value), box = $("results");
  if (q.length < 2) { box.style.display = "none"; return; }
  const hits = index.filter(x => slug(x.l.titre).includes(q) || slug(x.m.titre).includes(q) || slug(x.a.titre).includes(q)).slice(0, 14);
  box.innerHTML = hits.length ? hits.map(x => `<a href="#${x.r.id}--${x.l.id}">${x.l.titre}<small>${x.r.titre} › ${x.a.court} › ${x.m.titre}</small></a>`).join("")
                              : `<a style="color:#888;pointer-events:none">Aucun résultat</a>`;
  box.style.display = "block";
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("results").style.display = "none"; });

route();
</script>
