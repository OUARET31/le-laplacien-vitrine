<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LE LAPLACIEN — Cours de sciences du collège au supérieur</title>
<meta name="description" content="Cours, vidéos et exercices de mathématiques, physique-chimie, SVT, langage C, Python, électronique et FPGA/VHDL, du collège aux études supérieures.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#121a33;          /* bleu nuit */
    --blue:#2443b8;         /* bleu Laplace (liens) */
    --blue-dark:#162d86;
    --gold:#f2b134;         /* accent doré */
    --paper:#f7f5ef;        /* fond papier */
    --card:#ffffff;
    --text:#1d2238;
    --muted:#5d6380;
    --line:#e3e0d6;
    --header-h:70px;
    --c-college:#2a9d8f; --c-lycee:#2443b8; --c-sup:#c2410c;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--paper);line-height:1.65;font-size:16px}
  a{color:var(--blue);text-decoration:none;font-weight:500}
  a:hover{color:var(--blue-dark)}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em}

  /* ---------- En-tête ---------- */
  header{position:sticky;top:0;z-index:20;height:var(--header-h);background:var(--ink);color:#fff;
    display:flex;align-items:center;gap:28px;padding:0 4vw;box-shadow:0 2px 0 var(--gold)}
  .logo{display:flex;align-items:center;gap:12px;color:#fff;white-space:nowrap}
  .logo:hover{color:#fff}
  .logo .mark{width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;
    font-family:Fraunces,serif;font-weight:700;font-size:21px;line-height:1}
  .logo .mark sup{font-size:12px;margin-left:1px;position:relative;top:-7px;vertical-align:baseline}
  .logo .name{font-family:Fraunces,serif;font-weight:700;font-size:21px;letter-spacing:.08em}
  nav.topnav{display:flex;gap:6px;margin-left:auto}
  nav.topnav a{color:#dfe3f5;font-weight:500;padding:8px 14px;border-radius:8px;white-space:nowrap}
  nav.topnav a:hover{background:rgba(255,255,255,.08);color:#fff}
  nav.topnav a.active{background:var(--gold);color:var(--ink)}
  .search{position:relative}
  .search input{width:210px;padding:9px 12px 9px 36px;border:1px solid rgba(255,255,255,.18);border-radius:10px;font:inherit;font-size:14px;
    background:rgba(255,255,255,.08);color:#fff}
  .search input::placeholder{color:#aab1d0}
  .search input:focus{outline:2px solid var(--gold);outline-offset:-1px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aab1d0}
  .search-results{position:absolute;top:115%;right:0;width:320px;background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 12px 30px rgba(18,26,51,.15);display:none;max-height:360px;overflow:auto}
  .search-results a{display:block;padding:9px 14px;font-size:14px;border-bottom:1px solid #f1efe8}
  .search-results a:hover{background:#f7f5ef}
  .search-results small{display:block;color:var(--muted);font-weight:400}
  .burger{display:none;background:none;border:0;padding:6px;cursor:pointer;color:#fff}

  /* ---------- Accueil ---------- */
  .hero{background:var(--ink);color:#fff;padding:72px 4vw 96px;position:relative;overflow:hidden}
  .hero .inner{max-width:1100px;margin:0 auto;position:relative;z-index:1}
  .hero h1{font-size:clamp(40px,6vw,68px);margin:0 0 8px;letter-spacing:.06em}
  .hero .formula{font-family:Fraunces,serif;color:var(--gold);font-size:22px;margin-bottom:22px}
  .hero p{max-width:620px;color:#c8cde6;font-size:18px;margin:0}
  .hero svg.grid{position:absolute;right:-60px;top:-40px;width:560px;opacity:.16}
  .levels{max-width:1100px;margin:-56px auto 72px;padding:0 4vw;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;position:relative;z-index:2}
  .level-card{background:var(--card);border-radius:16px;padding:26px;box-shadow:0 10px 30px rgba(18,26,51,.08);border-top:6px solid var(--c);
    color:var(--text);transition:transform .2s, box-shadow .2s;display:flex;flex-direction:column}
  .level-card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(18,26,51,.14);color:var(--text)}
  .level-card h2{margin:0 0 6px;font-size:28px;color:var(--c)}
  .level-card p{margin:0 0 16px;color:var(--muted);font-weight:400}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .chip{font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px;background:#f1efe8;color:var(--text)}
  .level-card .go{margin-top:18px;color:var(--c);font-weight:600}

  /* ---------- Bandeau de rubrique ---------- */
  .banner{background:var(--ink);color:#fff;padding:34px 4vw 38px;border-bottom:4px solid var(--c, var(--gold))}
  .banner .inner{max-width:1500px;margin:0 auto}
  .banner .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .banner h1{margin:4px 0 4px;font-size:clamp(30px,4vw,44px)}
  .banner p{margin:0;color:#c8cde6;max-width:720px}

  /* ---------- Mise en page 3 colonnes ---------- */
  .layout{display:grid;grid-template-columns:260px minmax(0,1fr) 240px;gap:44px;max-width:1500px;margin:0 auto;padding:36px 4vw 80px}
  aside.left, aside.right{position:sticky;top:calc(var(--header-h) + 24px);align-self:start;max-height:calc(100vh - var(--header-h) - 48px);overflow:auto}
  .side-group{margin-bottom:4px}
  .side-group > button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;
    color:var(--ink);font-weight:600;font-size:16px;padding:10px 12px;border-radius:8px;line-height:1.4}
  .side-group > button:hover{background:#ece9df}
  .side-group > button .dot{width:10px;height:10px;border-radius:3px;background:var(--sc);margin-right:10px;flex:none}
  .side-group > button span{display:flex;align-items:center}
  .side-group > button svg{transition:transform .2s;flex:none;margin-left:10px;color:var(--muted)}
  .side-group.open > button svg{transform:rotate(90deg)}
  .side-group ul{list-style:none;margin:2px 0 10px 17px;padding:0 0 0 12px;border-left:2px solid var(--line);display:none}
  .side-group.open ul{display:block}
  .side-group li a{display:block;font-size:14.5px;font-weight:400;padding:4px 6px;color:#444b66;border-radius:6px}
  .side-group li a:hover{color:var(--blue)}
  .side-group li a.current{color:var(--blue);font-weight:600;background:#e9edfb}
  .side-group li a em{font-style:normal;font-size:12px;color:var(--muted);margin-right:4px}

  aside.right h4{margin:0 0 12px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  aside.right ul{list-style:none;margin:0;padding:0}
  aside.right li a{display:block;padding:5px 0 5px 12px;font-size:15px;border-left:2px solid var(--line);color:#444b66;font-weight:400}
  aside.right li a:hover{color:var(--blue)}
  aside.right li a.active{border-left-color:var(--gold);color:var(--ink);font-weight:600}

  main{min-width:0}

  /* Vidéo */
  .video{display:flex;max-width:760px;margin:0 auto 44px;aspect-ratio:16/9;background:var(--ink);border-radius:14px;position:relative;overflow:hidden;
    align-items:center;justify-content:center;color:#fff;box-shadow:0 12px 30px rgba(18,26,51,.18)}
  .video .bg{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
  .video .title{position:absolute;top:18px;left:22px;right:22px;font-family:Fraunces,serif;font-weight:700;font-size:22px}
  .video .title small{display:block;font-family:Inter,sans-serif;font-weight:400;font-size:13px;color:#c8cde6}
  .video .play{position:relative;width:76px;height:76px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;transition:transform .2s}
  .video:hover{color:#fff}
  .video:hover .play{transform:scale(1.08)}
  .video .hint{position:absolute;bottom:14px;left:22px;font-size:13px;color:#c8cde6}

  /* Blocs matières */
  section.block{max-width:860px;margin:0 auto 34px;background:var(--card);border-radius:14px;padding:26px 30px 22px;
    box-shadow:0 2px 0 var(--line);border-left:6px solid var(--sc);scroll-margin-top:calc(var(--header-h) + 20px)}
  section.block h2{font-size:26px;margin:0 0 4px;color:var(--ink);display:flex;align-items:center;gap:12px}
  section.block h2 .ico{width:36px;height:36px;border-radius:9px;background:var(--sc);color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:Inter,sans-serif;font-size:15px;font-weight:600;flex:none}
  section.block .desc{color:var(--muted);margin:0 0 14px}
  .lesson-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .lesson-grid a{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--text);font-weight:500;font-size:15px}
  .lesson-grid a:hover{border-color:var(--sc);background:#fbfaf6;color:var(--ink)}
  .tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:#f1efe8;color:var(--muted);flex:none}

  /* Page de leçon */
  .breadcrumb{font-size:14px;color:var(--muted);margin-bottom:10px}
  article.lesson{max-width:860px;margin:0 auto;background:var(--card);border-radius:14px;padding:34px 40px 30px;box-shadow:0 2px 0 var(--line)}
  article.lesson h1{font-size:36px;color:var(--ink);margin:0 0 6px;line-height:1.2}
  article.lesson .meta{display:flex;gap:8px;margin-bottom:10px}
  article.lesson .rule{height:4px;width:80px;background:var(--gold);border-radius:2px;margin:14px 0 6px}
  article.lesson h2{font-size:24px;margin:34px 0 10px;color:var(--ink);scroll-margin-top:calc(var(--header-h) + 20px)}
  pre{background:var(--ink);color:#e8ebf7;padding:18px 20px;border-radius:10px;overflow:auto;font-family:"JetBrains Mono",monospace;font-size:14px;line-height:1.6}
  code{font-family:"JetBrains Mono",monospace}
  p code, li code{background:#eef0fa;color:var(--blue-dark);padding:1px 6px;border-radius:4px;font-size:.9em}
  .formula-box{background:#fbf6e8;border:1px solid #efdcaa;border-radius:10px;padding:20px;text-align:center;font-family:Fraunces,serif;font-size:24px;color:var(--ink)}
  .note{background:#fbf6e8;border-left:4px solid var(--gold);padding:12px 16px;border-radius:0 8px 8px 0;margin:20px 0}
  .pager{display:flex;justify-content:space-between;gap:16px;margin-top:44px;padding-top:20px;border-top:1px solid var(--line)}
  .pager a{display:block;padding:12px 16px;border:1px solid var(--line);border-radius:10px;max-width:48%}
  .pager a small{display:block;color:var(--muted);font-weight:400}
  .pager a:hover{border-color:var(--blue)}

  footer{background:var(--ink);color:#aab1d0;text-align:center;font-size:14px;padding:26px}
  footer b{color:#fff;font-family:Fraunces,serif;letter-spacing:.08em}

  /* ---------- Responsive ---------- */
  @media (max-width:1200px){
    .layout{grid-template-columns:240px minmax(0,1fr)}
    aside.right{display:none}
  }
  @media (max-width:900px){
    .levels{grid-template-columns:1fr}
    .lesson-grid{grid-template-columns:1fr}
  }
  @media (max-width:820px){
    header{gap:12px}
    .logo .name{font-size:17px}
    .burger{display:block;margin-left:auto}
    .search{display:none}
    nav.topnav{position:fixed;top:var(--header-h);left:0;right:0;background:var(--ink);flex-direction:column;gap:4px;padding:10px 4vw 16px;display:none;margin:0}
    nav.topnav.open{display:flex}
    .layout{grid-template-columns:1fr;gap:16px}
    aside.left{position:static;max-height:none}
    article.lesson{padding:24px 20px}
    section.block{padding:22px 18px}
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#accueil" aria-label="Accueil LE LAPLACIEN">
    <span class="mark">∇<sup>2</sup></span>
    <span class="name">LE LAPLACIEN</span>
  </a>
  <nav class="topnav" id="topnav"></nav>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Rechercher une leçon…" autocomplete="off">
    <div class="search-results" id="results"></div>
  </div>
  <button class="burger" id="burger" aria-label="Menu">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
</header>

<div id="app"></div>

<footer><b>LE LAPLACIEN</b> · © <span id="year"></span> · Cours et exercices du collège au supérieur</footer>

<script>
/* =====================================================================
   CONTENU DU SITE — ajoutez ici vos rubriques, matières et leçons.
   Une leçon peut s'écrire "Titre" ou ["Niveau", "Titre"].
   ===================================================================== */
const SITE = [
  { id:"college", titre:"Collège", couleur:"#2a9d8f",
    intro:"De la 6e à la 3e : les notions essentielles pour réussir le brevet.",
    video:{ titre:"Bienvenue au collège", duree:"05:30", url:"https://www.youtube.com/" },
    matieres:[
      { titre:"Mathématiques", ico:"π", couleur:"#2443b8", desc:"Nombres, calcul, géométrie et fonctions.",
        lecons:[["6e","Les nombres décimaux"],["6e","Les fractions"],["5e","Les nombres relatifs"],["5e","La proportionnalité"],
                ["4e","Le théorème de Pythagore"],["4e","Les puissances"],["3e","Les fonctions affines"],["3e","Le théorème de Thalès"]] },
      { titre:"Physique-Chimie", ico:"PC", couleur:"#c2410c", desc:"Matière, énergie, mouvement et signaux.",
        lecons:[["5e","Les états de la matière"],["5e","Le circuit électrique"],["4e","Atomes et molécules"],["4e","Vitesse et mouvement"],
                ["3e","L'énergie électrique"],["3e","Les ions et le pH"]] },
      { titre:"SVT", ico:"SV", couleur:"#2a9d8f", desc:"Le vivant, le corps humain et la planète Terre.",
        lecons:[["5e","La respiration des êtres vivants"],["5e","Nutrition et digestion"],["4e","Séismes et volcans"],["4e","La reproduction humaine"],
                ["3e","Génétique et ADN"],["3e","Le système immunitaire"]] }
    ]},
  { id:"lycee", titre:"Lycée", couleur:"#2443b8",
    intro:"Seconde, Première et Terminale : approfondir et préparer le bac.",
    video:{ titre:"Réussir au lycée", duree:"06:45", url:"https://www.youtube.com/" },
    matieres:[
      { titre:"Mathématiques", ico:"π", couleur:"#2443b8", desc:"Fonctions, analyse, géométrie et probabilités.",
        lecons:[["2de","Les fonctions de référence"],["2de","Les vecteurs"],["1re","Le second degré"],["1re","La dérivation"],
                ["Tle","Limites et continuité"],["Tle","Le logarithme népérien"]] },
      { titre:"Physique-Chimie", ico:"PC", couleur:"#c2410c", desc:"Mécanique, ondes, énergie et transformations chimiques.",
        lecons:[["2de","Lumière et spectres"],["2de","Mouvement et forces"],["1re","Énergie et travail"],["1re","Les ondes mécaniques"],
                ["Tle","La mécanique de Newton"],["Tle","La cinétique chimique"]] },
      { titre:"SVT", ico:"SV", couleur:"#2a9d8f", desc:"Cellule, génétique, géologie et climat.",
        lecons:[["2de","La cellule"],["2de","La biodiversité"],["1re","L'expression du génome"],["1re","La tectonique des plaques"],
                ["Tle","Génétique et évolution"],["Tle","Le climat de la Terre"]] }
    ]},
  { id:"superieur", titre:"Supérieur", couleur:"#c2410c",
    intro:"BTS, BUT, licence et écoles d'ingénieurs : programmation, électronique et conception numérique.",
    video:{ titre:"Du code au silicium", duree:"08:10", url:"https://www.youtube.com/" },
    matieres:[
      { id:"langage-c", titre:"Langage C", ico:"C", couleur:"#4b5bd6", desc:"La programmation bas niveau, au plus près de la machine.",
        lecons:["Variables, types et opérateurs","Conditions et boucles","Fonctions","Tableaux et chaînes de caractères","Les pointeurs","Structures","Allocation dynamique","Compilation et Makefile"] },
      { id:"python", titre:"Python", ico:"Py", couleur:"#2a9d8f", desc:"Programmer vite et bien, du script au calcul scientifique.",
        lecons:["Les bases du langage","Fonctions et modules","Listes, dictionnaires et ensembles","Programmation orientée objet","Fichiers et données","NumPy et Matplotlib"] },
      { id:"electronique", titre:"Électronique / Microélectronique", ico:"Ω", couleur:"#c2410c", desc:"Des composants discrets aux circuits intégrés.",
        lecons:["Lois de Kirchhoff","Diodes et transistors","L'amplificateur opérationnel","Logique combinatoire","La technologie CMOS","Conception de circuits intégrés"] },
      { id:"fpga-vhdl", titre:"FPGA / VHDL", ico:"⌗", couleur:"#7c3aed", desc:"Décrire du matériel et le programmer sur FPGA.",
        lecons:["Architecture d'un FPGA","Structure d'une description VHDL","Logique combinatoire en VHDL","Logique séquentielle et registres","Machines à états","Simulation et testbench"] }
    ]}
];

/* Exemples affichés dans les pages de leçon, selon la matière */
const EXEMPLES = {
  "langage-c": {type:"code", texte:`#include <stdio.h>

int main(void) {
    int notes[] = {12, 15, 9, 17};
    int somme = 0;
    for (int i = 0; i < 4; i++)
        somme += notes[i];
    printf("Moyenne : %.2f\\n", somme / 4.0);
    return 0;
}`},
  "python": {type:"code", texte:`def moyenne(notes):
    return sum(notes) / len(notes)

print(moyenne([12, 15, 9, 17]))   # affiche 13.25`},
  "fpga-vhdl": {type:"code", texte:`process(clk, reset)
begin
  if reset = '1' then
    q <= (others => '0');
  elsif rising_edge(clk) then
    if load = '1' then
      q <= d;
    end if;
  end if;
end process;`},
  "electronique": {type:"formule", texte:"U = R · I"},
  "mathematiques": {type:"formule", texte:"Δf = ∂²f/∂x² + ∂²f/∂y²"},
  "physique-chimie": {type:"formule", texte:"E = ½ · m · v²"},
  "svt": {type:"note", texte:"Ajoutez ici un schéma légendé, une photo de lame au microscope ou un document à analyser."}
};

/* ===================== Moteur du site (pas besoin d'y toucher) ===================== */
const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
SITE.forEach(r => r.matieres.forEach(m => {
  m.id = m.id || slug(m.titre);
  m.lecons = m.lecons.map(t => Array.isArray(t) ? {niveau:t[0], titre:t[1]} : {titre:t});
  m.lecons.forEach(l => l.id = m.id + "-" + slug((l.niveau ? l.niveau + "-" : "") + l.titre));
}));

const $ = id => document.getElementById(id);
const chevron = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>';
let spy = null;

function renderNav(current){
  $("topnav").innerHTML = `<a href="#accueil" class="${!current?'active':''}">Accueil</a>` +
    SITE.map(r => `<a href="#${r.id}" class="${r.id===current?'active':''}">${r.titre}</a>`).join("");
}

function renderHome(){
  renderNav(null);
  $("app").innerHTML = `
    <section class="hero">
      <svg class="grid" viewBox="0 0 400 300" fill="none" stroke="#f2b134" stroke-width="1.4">
        ${Array.from({length:14},(_,i)=>`<path d="M0 ${20*i+10} C 100 ${20*i-30}, 300 ${20*i+50}, 400 ${20*i+10}"/>`).join("")}
      </svg>
      <div class="inner">
        <h1>LE LAPLACIEN</h1>
        <div class="formula">Δf = ∇²f = ∂²f/∂x² + ∂²f/∂y² + ∂²f/∂z²</div>
        <p>Cours, vidéos et exercices en sciences, du collège jusqu'aux études supérieures. Choisissez votre niveau pour commencer.</p>
      </div>
    </section>
    <div class="levels">
      ${SITE.map(r => `
        <a class="level-card" href="#${r.id}" style="--c:${r.couleur}">
          <h2>${r.titre}</h2>
          <p>${r.intro}</p>
          <div class="chips">${r.matieres.map(m => `<span class="chip">${m.titre}</span>`).join("")}</div>
          <span class="go">Entrer →</span>
        </a>`).join("")}
    </div>`;
  if (spy) spy.disconnect();
}

function shell(r, bannerHtml){
  $("app").innerHTML = `
    <div class="banner" style="--c:${r.couleur}"><div class="inner">${bannerHtml}</div></div>
    <div class="layout">
      <aside class="left" id="left"></aside>
      <main id="main"></main>
      <aside class="right" id="right"></aside>
    </div>`;
}

function renderLeft(r, lessonId){
  $("left").innerHTML = r.matieres.map(m => {
    const open = lessonId && m.lecons.some(l => l.id === lessonId);
    return `<div class="side-group ${open ? 'open' : ''}" style="--sc:${m.couleur}">
      <button><span><i class="dot"></i>${m.titre}</span>${chevron}</button>
      <ul>${m.lecons.map(l => `<li><a href="#${r.id}--${l.id}" class="${l.id===lessonId?'current':''}">${l.niveau?`<em>${l.niveau}</em>`:""}${l.titre}</a></li>`).join("")}</ul>
    </div>`;
  }).join("");
  $("left").querySelectorAll(".side-group > button").forEach(b => b.onclick = () => b.parentElement.classList.toggle("open"));
}

function renderRight(items){
  $("right").innerHTML = `<h4>Sur cette page</h4><ul>${items.map(i => `<li><a href="#" data-target="${i.id}">${i.titre}</a></li>`).join("")}</ul>`;
  $("right").querySelectorAll("a").forEach(a => a.onclick = e => {
    e.preventDefault();
    document.getElementById(a.dataset.target)?.scrollIntoView({behavior:"smooth"});
  });
  if (spy) spy.disconnect();
  spy = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting)
        $("right").querySelectorAll("a").forEach(a => a.classList.toggle("active", a.dataset.target === en.target.id));
    });
  }, { rootMargin:"-30% 0px -60% 0px" });
  items.forEach(i => { const el = document.getElementById(i.id); if (el) spy.observe(el); });
}

function videoBlock(v){
  const waves = Array.from({length:7},(_,i)=>`<path d="M0 ${60+i*40} C 160 ${20+i*40}, 480 ${100+i*40}, 640 ${60+i*40}"/>`).join("");
  return `<a class="video" href="${v.url}" target="_blank" rel="noopener">
    <svg class="bg" viewBox="0 0 640 360" preserveAspectRatio="none" fill="none" stroke="#f2b134" stroke-width="1.2" opacity=".6">${waves}</svg>
    <div class="title">${v.titre}<small>Vidéo de présentation</small></div>
    <div class="play"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="#121a33"/></svg></div>
    <div class="hint">${v.duree} · Ouvrir sur YouTube</div>
  </a>`;
}

function renderRubrique(r){
  renderNav(r.id);
  shell(r, `<div class="kicker">Rubrique</div><h1>${r.titre}</h1><p>${r.intro}</p>`);
  renderLeft(r);
  $("main").innerHTML = `<div class="note" style="max-width:860px;margin:0 auto 34px"><strong>Lancement prochainement :</strong> les leçons, vidéos et exercices de cette rubrique arrivent bientôt sur LE LAPLACIEN.</div>` + r.matieres.map(m => `
    <section class="block" id="${m.id}" style="--sc:${m.couleur}">
      <h2><span class="ico">${m.ico}</span>${m.titre}</h2>
      <p class="desc">${m.desc}</p>
      <div class="lesson-grid">${m.lecons.map(l => `<a href="#${r.id}--${l.id}">${l.niveau?`<span class="tag">${l.niveau}</span>`:""}${l.titre}</a>`).join("")}</div>
    </section>`).join("");
  renderRight(r.matieres);
}

function renderLesson(r, lessonId){
  const all = r.matieres.flatMap(m => m.lecons.map(l => ({...l, matiere:m})));
  const idx = all.findIndex(l => l.id === lessonId);
  if (idx < 0) return renderRubrique(r);
  const l = all[idx], m = l.matiere;
  const prev = all[idx-1]?.matiere === m ? all[idx-1] : null;
  const next = all[idx+1]?.matiere === m ? all[idx+1] : null;
  renderNav(r.id);
  shell(r, `<div class="kicker">${r.titre} · ${m.titre}</div><h1>${l.titre}</h1>`);
  renderLeft(r, lessonId);
  const ex = EXEMPLES[m.id] || {type:"note", texte:"Ajoutez ici un exemple ou un exercice."};
  const exHtml = ex.type === "code" ? `<pre><code>${esc(ex.texte)}</code></pre>`
              : ex.type === "formule" ? `<div class="formula-box">${ex.texte}</div>`
              : `<div class="note">${ex.texte}</div>`;
  $("main").innerHTML = `
    <article class="lesson">
      <div class="breadcrumb"><a href="#accueil">Accueil</a> › <a href="#${r.id}">${r.titre}</a> › ${m.titre}</div>
      <div class="meta">${l.niveau?`<span class="tag">${l.niveau}</span>`:""}<span class="tag">${m.titre}</span></div>
      <h1>${l.titre}</h1>
      <div class="rule"></div>
      <h2 id="bientot">Bientôt disponible</h2>
      <p>Cette leçon est en cours de préparation. Elle sera bientôt accessible avec son cours, sa vidéo et ses exercices corrigés.</p>
      <div class="pager">
        ${prev ? `<a href="#${r.id}--${prev.id}"><small>‹ Précédent</small>${prev.titre}</a>` : "<span></span>"}
        ${next ? `<a href="#${r.id}--${next.id}" style="text-align:right"><small>Suivant ›</small>${next.titre}</a>` : ""}
      </div>
    </article>`;
  const parts = [{id:"bientot",titre:"Bientôt disponible"}];
  renderRight(parts);
}

function route(){
  const h = location.hash.slice(1);
  const [rid, lid] = h.split("--");
  const r = SITE.find(x => x.id === rid);
  if (!r) renderHome();
  else if (lid) renderLesson(r, lid);
  else renderRubrique(r);
  $("topnav").classList.remove("open");
  window.scrollTo({top:0});
}
window.addEventListener("hashchange", route);
$("burger").onclick = () => $("topnav").classList.toggle("open");
$("year").textContent = new Date().getFullYear();

/* Recherche dans toutes les leçons */
const index = SITE.flatMap(r => r.matieres.flatMap(m => m.lecons.map(l => ({r, m, l}))));
$("q").addEventListener("input", e => {
  const q = slug(e.target.value);
  const box = $("results");
  if (q.length < 2){ box.style.display = "none"; return; }
  const hits = index.filter(x => slug(x.l.titre).includes(q) || slug(x.m.titre).includes(q)).slice(0, 14);
  box.innerHTML = hits.length ? hits.map(x => `<a href="#${x.r.id}--${x.l.id}">${x.l.titre}<small>${x.r.titre} › ${x.m.titre}${x.l.niveau?" · "+x.l.niveau:""}</small></a>`).join("")
                              : `<a style="color:#888;pointer-events:none">Aucun résultat</a>`;
  box.style.display = "block";
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("results").style.display = "none"; });

route();
</script>
</body>
</html>
